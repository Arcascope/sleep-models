[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "arcasleep-bidoze"
dynamic = ["version"]
description = "Reproducible training and release tooling for BiDoze sleep-stage models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arcascope Inc", email = "support@arcascope.com" }]
keywords = ["sleep", "actigraphy", "accelerometer", "sleep-staging", "wearables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# The base distribution is deliberately dependency-free: its only commands are
# the manifest tools, which need the standard library alone. Every other
# command imports its dependencies inside the handler and prints the extra to
# install when one is missing, so a bare `pip install arcasleep-bidoze`
# gives a working CLI.
dependencies = []

[project.optional-dependencies]
# Local inference from published releases (safetensors bundles): `bidoze
# predict` runs the bundle's spectrogram pipeline, so it needs pisces-lite's
# senpy NUFFT with its JAX backend (CPU is fine; add a CUDA jax for a GPU).
# pisces-lite also supplies the dataset/IO and metric registry; 4.1.1 is the
# version this release was validated against.
inference = ["jax", "flax", "pisces-lite[proc,jax]>=4.1.1", "safetensors"]
# Reading a released Hugging Face bundle straight from the Hub.
hub = ["safetensors", "huggingface_hub"]
# Feature processing only: pisces-lite[proc] pulls arcascope-senpy, the NUFFT
# backend, a prebuilt wheel on PyPI. The train and inference paths
# read a prebuilt cache and do not need it. For the JAX NUFFT backend
# (inputs.json nufft_backend="jax") add the JAX build yourself -- on a GPU box
# that is `pip install "jax[cuda12]"`, since no library here picks a CUDA
# version:
#     pip install '.[prep]' 'pisces-lite[jax]' 'jax[cuda12]'
prep = ["pisces-lite[proc]>=4.1.1"]
# Train includes matplotlib; comparing summaries needs it without the JAX stack.
train = ["jax", "flax", "optax", "pisces-lite>=4.1.1", "matplotlib"]
report = ["matplotlib", "pandas"]
aws = ["boto3>=1.34"]
# Build a release bundle from a checkpoint, including the metrics comparison
# grid drawn from the phase's own results CSV. Uploading it to the Hub adds
# huggingface_hub, which the `hub` extra carries.
publish = ["safetensors", "matplotlib", "pandas"]
# Render a built bundle's model card to standalone HTML for local review.
preview = ["markdown-it-py>=3"]
all = ["jax", "flax", "optax", "pisces-lite>=4.1.1", "matplotlib", "boto3>=1.34", "safetensors"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
bidoze = "bidoze.cli:main"

[project.urls]
Homepage = "https://github.com/Arcascope/sleep-models"
Repository = "https://github.com/Arcascope/sleep-models"
Issues = "https://github.com/Arcascope/sleep-models/issues"
Documentation = "https://huggingface.co/arcascope/arcasleep-bidoze-pediatric"

[tool.setuptools.packages.find]
where = ["src"]

# The version comes from the nearest `bidoze-vX.Y.Z` Git tag, so bumping it is
# a tag, not an edit: the distribution version and the release tag cannot drift
# apart. This is a monorepo member, so the repository root is one level up and
# the tag is namespaced; commits past a tag describe as the next patch dev
# version (0.1.1.devN), which is what a TestPyPI dry run should publish.
[tool.setuptools_scm]
root = ".."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
tag_regex = "^bidoze-v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"

[tool.setuptools.package-data]
"bidoze.artifacts" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
