[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "arcasleep"
dynamic = ["version"]
description = "Arcascope's open sleep-stage models: training, evaluation, release and inference"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arcascope Inc", email = "support@arcascope.com" }]
keywords = ["sleep", "actigraphy", "accelerometer", "sleep-staging", "wearables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# The base distribution is deliberately dependency-free: its only commands are
# the manifest tools, which need the standard library alone. Every other
# command imports its dependencies inside the handler and prints the extra to
# install when one is missing, so a bare `pip install arcasleep` gives a
# working CLI.
dependencies = []

[project.optional-dependencies]
# The one pisces-lite pin: every extra below that needs pisces-lite pulls it in
# through this one, so bumping the version here bumps it everywhere. The train
# image installs exactly this version (deploy/scripts/build_train_image.sh
# reads it).
pisces = ["pisces-lite>=4.2.0"]
# One extra per model family: what loading and running that network needs.
# Training or predicting also needs the `train` or `inference` extra.
bidoze = ["jax", "flax", "optax"]
unet = ["jax", "flax", "optax"]
# Boosted trees for the watch: feature tables from raw cohorts, LightGBM training, export.
tree = ["numpy", "scipy", "pandas", "pyarrow", "lightgbm", "scikit-learn", "safetensors", "arcasleep[prep]"]
# Local inference from published releases (safetensors bundles): `predict`
# runs the bundle's spectrogram pipeline, so it needs pisces-lite's senpy NUFFT
# with its JAX backend (CPU is fine; add a CUDA jax for a GPU). pisces-lite also
# supplies the dataset/IO and metric registry.
inference = ["jax", "flax", "pisces-lite[proc,jax]", "arcasleep[pisces]", "safetensors"]
# Reading a released Hugging Face bundle straight from the Hub.
hub = ["safetensors", "huggingface_hub"]
# Feature processing only: pisces-lite[proc] pulls arcascope-senpy, the NUFFT
# backend, a prebuilt wheel on PyPI. The train and inference paths
# read a prebuilt cache and do not need it. For the JAX NUFFT backend
# (inputs.json nufft_backend="jax") add the JAX build yourself -- on a GPU box
# that is `pip install "jax[cuda12]"`, since no library here picks a CUDA
# version:
#     pip install '.[prep]' 'pisces-lite[jax]' 'jax[cuda12]'
prep = ["pisces-lite[proc]", "arcasleep[pisces]"]
# Train includes matplotlib; comparing summaries needs it without the JAX stack.
train = ["jax", "flax", "optax", "arcasleep[pisces]", "matplotlib"]
report = ["matplotlib", "pandas"]
aws = ["boto3>=1.34"]
# Build a release bundle from a checkpoint, including the metrics comparison
# grid drawn from the phase's own results CSV. Uploading it to the Hub adds
# huggingface_hub, which the `hub` extra carries.
publish = ["safetensors", "matplotlib", "pandas"]
# Render a built bundle's model card to standalone HTML for local review.
preview = ["markdown-it-py>=3"]
# Shell tab completion of commands, model families and options.
completion = ["argcomplete>=3"]
all = [
    "arcasleep[bidoze,unet,tree,inference,hub,prep,train,report,aws,publish,preview,completion]",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
arcasleep = "arcasleep.cli:main"

[project.urls]
Homepage = "https://github.com/Arcascope/sleep-models"
Repository = "https://github.com/Arcascope/sleep-models"
Issues = "https://github.com/Arcascope/sleep-models/issues"
Documentation = "https://huggingface.co/arcascope"

# The shared code and each model family keep their own source tree; one
# distribution installs them all.
[tool.setuptools.packages.find]
where = ["core/src", "bidoze/src", "unet/src", "tree/src"]

[tool.setuptools.package-data]
"arcasleep.artifacts" = ["templates/*.md"]

# The version comes from the nearest `arcasleep-vX.Y.Z` Git tag, so bumping it
# is a tag, not an edit: the distribution version and the release tag cannot
# drift apart. Commits past a tag describe as the next patch dev version
# (0.1.1.devN), which is what a TestPyPI dry run should publish.
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
tag_regex = "^arcasleep-v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines and zip() without strict= are not errors.
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
# The packages live under `<tree>/src/`, which ruff does not discover as source
# roots from the repository root, so they are otherwise treated as third-party.
# Naming them keeps the convention -- a third-party block, a blank line, then
# the first-party block -- under `ruff check --fix`.
known-first-party = ["arcasleep", "arcasleep_bidoze", "arcasleep_unet", "arcasleep_tree"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "bidoze/tests", "unet/tests", "tree/tests"]
