AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Self-contained GPU training infrastructure for every Arcasleep model family:
  one VPC, cluster, GPU capacity, roles, image repositories and an image build
  project.
  Nothing here is shared with any other stack, so deleting the stack removes
  everything it made.

Parameters:
  NamePrefix:
    Type: String
    Default: arcasleep-train
    Description: Prefix for every resource this stack names.

  MaxInstances:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 4
    Description: >
      Most GPU instances running at once; each runs one training task. The
      account's on-demand G/VT quota is 32 vCPUs, so four 8-vCPU instances
      use all of it, leaving none for any other GPU work in the account.

  InstanceType:
    Type: String
    Default: g6.2xlarge
    Description: >
      One GPU with 24 GB VRAM. g6.2xlarge is an L4 with 8 vCPU and 32 GiB RAM;
      g5.2xlarge (A10G) is the same VRAM on older silicon if L4 capacity is
      short. BiDoze and UNet both train within 22 GB.

  GpuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id
    Description: >
      ECS-optimized GPU AMI, resolved at deploy time. It ships the NVIDIA
      driver and container runtime, so nothing has to be installed on boot.

  RootVolumeSizeGb:
    Type: Number
    Default: 200
    Description: >
      A training image is ~8 GB. A prep task also syncs its raw datasets
      (~47 GB across weaver, SleepAccel and bidsleep) and writes the cache.

  ResultsBucket:
    Type: String
    Default: arcascope-sleep-models-data
    Description: Bucket the finished run is uploaded to.

  ResultsPrefix:
    Type: String
    Default: training_outputs
    Description: Key prefix under ResultsBucket. The task role is scoped to it.

  LogRetentionDays:
    Type: Number
    Default: 30

  DataPrefix:
    Type: String
    Default: data
    Description: Key prefix under ResultsBucket holding raw datasets, one directory each.

  FeatureCachePrefix:
    Type: String
    Default: feature_cache
    Description: Key prefix under ResultsBucket holding feature caches, one per cache prefix.

  BuildSourcePrefix:
    Type: String
    Default: codebuild/source
    Description: Key prefix under ResultsBucket for the source archives remote builds read.

Resources:
  # ---------------------------------------------------------------- network
  # A job that pulls an image and writes to S3 needs egress and nothing else.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-igw" }]

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Four AZs: GPU instance families often run out of capacity in a single
  # zone, and a subnet costs nothing.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-a" }]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-b" }]

  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.32.0/20
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-c" }]

  SubnetD:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.48.0/20
      AvailabilityZone: !Select [3, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-d" }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-rt" }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }

  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  SubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetC, RouteTableId: !Ref RouteTable }

  SubnetDRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetD, RouteTableId: !Ref RouteTable }

  # No ingress rule at all: the job is not a service and nobody connects to it.
  # Shell access, if ever needed, is ECS Exec over SSM, which is outbound.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} egress only"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: ECR, S3, CloudWatch, SSM
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-sg" }]

  # ------------------------------------------------------------------- image
  # One repository for feature-cache data images, one per model family for
  # training images. Tags are immutable: a run is pinned by digest, and an
  # immutable tag makes the code half of a run fingerprint mean something.
  # Adding a model family means adding its repository here and its output.
  # Python, pisces-lite and CUDA jax: rebuilt only when a pin changes.
  DepsRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}/deps"
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 5 most recent images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

  # Feature-cache build images.
  PrepRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}/prep"
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 5 most recent images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

  DataRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}/data"
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 10 most recent images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  BidozeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}/bidoze"
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 20 most recent images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  UnetRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}/unet"
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the 20 most recent images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${NamePrefix}"
      RetentionInDays: !Ref LogRetentionDays

  # -------------------------------------------------------------------- IAM
  # The instance registers itself with the cluster and pulls the image.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-instance" }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  # ECS itself uses this to pull the image and open the log stream, before the
  # container exists. It is not the container's identity.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-execution" }]

  # The container's own identity: write the run's results, and nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: results-upload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Scoped to the results prefix. A training job has no reason to
              # read or write anything else in the bucket.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}/${ResultsPrefix}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Condition:
                  StringLike: { "s3:prefix": !Sub "${ResultsPrefix}/*" }
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}"
        - PolicyName: exec-shell
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-task" }]

  # A feature-cache build reads raw datasets and writes the cache; it has no
  # access to training results.
  PrepTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cache-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}/${DataPrefix}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}/${FeatureCachePrefix}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Condition:
                  StringLike:
                    "s3:prefix": [!Sub "${DataPrefix}/*", !Sub "${FeatureCachePrefix}/*"]
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}"
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-prep" }]

  # ------------------------------------------------------------ image builds
  # Builds and pushes images inside AWS, so pulling the CUDA wheels and
  # pushing multi-GB images does not depend on a workstation's network.
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${NamePrefix}"
      RetentionInDays: !Ref LogRetentionDays

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: image-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !GetAtt DepsRepository.Arn
                  - !GetAtt PrepRepository.Arn
                  - !GetAtt DataRepository.Arn
                  - !GetAtt BidozeRepository.Arn
                  - !GetAtt UnetRepository.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub "arn:aws:s3:::${ResultsBucket}/${BuildSourcePrefix}/*"
                  - !Sub "arn:aws:s3:::${ResultsBucket}/${FeatureCachePrefix}/*"
              - Effect: Allow
                Action: [s3:GetBucketAcl, s3:GetBucketLocation]
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}"
              - Effect: Allow
                Action: s3:ListBucket
                Condition:
                  StringLike: { "s3:prefix": !Sub "${FeatureCachePrefix}/*" }
                Resource: !Sub "arn:aws:s3:::${ResultsBucket}"
      Tags: [{ Key: Name, Value: !Sub "${NamePrefix}-build" }]

  # No source of its own: remote_build.sh supplies the source archive and the
  # buildspec path on every build. Privileged mode runs the Docker daemon.
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref NamePrefix
      ServiceRole: !GetAtt BuildRole.Arn
      # Builds cost per minute; a hung one stops at the timeout, and at most
      # two run at once.
      TimeoutInMinutes: 60
      ConcurrentBuildLimit: 2
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "start builds with deploy/scripts/remote_build.sh" && exit 1
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: DEPS_REPO, Value: !GetAtt DepsRepository.RepositoryUri }
          - { Name: PREP_REPO, Value: !GetAtt PrepRepository.RepositoryUri }
          - { Name: DATA_REPO, Value: !GetAtt DataRepository.RepositoryUri }
          - { Name: BIDOZE_REPO, Value: !GetAtt BidozeRepository.RepositoryUri }
          - { Name: UNET_REPO, Value: !GetAtt UnetRepository.RepositoryUri }
          - { Name: CACHE_S3, Value: !Sub "s3://${ResultsBucket}/${FeatureCachePrefix}" }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

  # -------------------------------------------------------- GPU capacity
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${NamePrefix}-lt"
      LaunchTemplateData:
        ImageId: !Ref GpuAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref TaskSecurityGroup]
        MetadataOptions: { HttpTokens: required }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref RootVolumeSizeGb
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${NamePrefix}" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_GPU_SUPPORT=true" >> /etc/ecs/ecs.config
            # The image is large; give the pull room before ECS gives up.
            echo "ECS_IMAGE_PULL_BEHAVIOR=default" >> /etc/ecs/ecs.config
            echo "ECS_CONTAINER_STOP_TIMEOUT=2m" >> /etc/ecs/ecs.config

  # Desired 0: the capacity provider starts one instance per placed task, up
  # to MaxInstances, and scales back to nothing when they end. A training run
  # should not leave a GPU idling.
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${NamePrefix}-asg"
      MinSize: "0"
      MaxSize: !Ref MaxInstances
      DesiredCapacity: "0"
      VPCZoneIdentifier: [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC, !Ref SubnetD]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      NewInstancesProtectedFromScaleIn: true
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-gpu", PropagateAtLaunch: true }
        - { Key: AmazonECSManaged, Value: "", PropagateAtLaunch: true }

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "${NamePrefix}-capacity"
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: !Ref MaxInstances
        ManagedTerminationProtection: ENABLED

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref NamePrefix
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  ClusterCapacity:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1

Outputs:
  ClusterName: { Value: !Ref Cluster }
  CapacityProviderName: { Value: !Sub "${NamePrefix}-capacity" }
  AutoScalingGroupName: { Value: !Ref AutoScalingGroup }
  MaxInstances: { Value: !Ref MaxInstances }
  InstanceType: { Value: !Ref InstanceType }
  DepsRepositoryUri: { Value: !GetAtt DepsRepository.RepositoryUri }
  PrepRepositoryUri: { Value: !GetAtt PrepRepository.RepositoryUri }
  DataRepositoryUri: { Value: !GetAtt DataRepository.RepositoryUri }
  BidozeRepositoryUri: { Value: !GetAtt BidozeRepository.RepositoryUri }
  UnetRepositoryUri: { Value: !GetAtt UnetRepository.RepositoryUri }
  ExecutionRoleArn: { Value: !GetAtt ExecutionRole.Arn }
  TaskRoleArn: { Value: !GetAtt TaskRole.Arn }
  LogGroupName: { Value: !Ref LogGroup }
  SubnetIds: { Value: !Join [",", [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC, !Ref SubnetD]] }
  SecurityGroupId: { Value: !Ref TaskSecurityGroup }
  ResultsUri: { Value: !Sub "s3://${ResultsBucket}/${ResultsPrefix}" }
  PrepTaskRoleArn: { Value: !GetAtt PrepTaskRole.Arn }
  DataUri: { Value: !Sub "s3://${ResultsBucket}/${DataPrefix}" }
  FeatureCacheUri: { Value: !Sub "s3://${ResultsBucket}/${FeatureCachePrefix}" }
  BuildProjectName: { Value: !Ref BuildProject }
  BuildSourceUri: { Value: !Sub "s3://${ResultsBucket}/${BuildSourcePrefix}" }
