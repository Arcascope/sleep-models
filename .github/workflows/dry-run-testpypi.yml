name: Dry run publish to TestPyPI

# Manual dry run of the release path against TestPyPI. Requires a TestPyPI
# Trusted Publisher for this repository (workflow `dry-run-testpypi.yml`,
# environment `testpypi`).
#
# Because arcasleep-bidoze is a monorepo member, the workflow is named for the
# distribution and only builds bidoze/.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (branch, tag, or SHA)"
        required: false
        default: main
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: setuptools-scm derives the version from the
      # nearest `bidoze-v*` tag, which a shallow clone would not contain.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the bidoze sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist bidoze
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run the test suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/"*.whl pytest "jax" "flax" "pisces-lite>=4.1.0" safetensors pandas matplotlib
          python -m pytest bidoze/tests -q

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arcasleep-bidoze
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: List distributions
        run: ls -lh dist
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
