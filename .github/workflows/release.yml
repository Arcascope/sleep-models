name: release

# Builds and publishes arcascope-autofish to PyPI when a GitHub Release is
# published.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret is
# stored. PyPI must have a publisher configured for this repository and the
# workflow filename below (`release.yml`), bound to the `pypi` environment.
# See https://docs.pypi.org/trusted-publishers/.
#
# This is a monorepo: the release tag is namespaced per distribution
# (`autofish-v1.0.0`). Only autofish/ is built here; other model families get
# their own workflow and their own PyPI publisher.
#
# For a TestPyPI dry run, use the separate "dry-run-testpypi" workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA); publishing still requires a release tag"
        required: false
        default: main
        type: string

jobs:
  build:
    name: Build distributions
    # Monorepo guard: only react to this distribution's namespaced tags
    # (`autofish-v*`), or to a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'autofish-v')
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: setuptools-scm derives the version from the
      # nearest `autofish-v*` tag, which a shallow clone would not contain.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine
      - name: Build the autofish sdist and wheel
        run: python -m build --outdir dist autofish
      - name: Check distribution metadata
        run: twine check dist/*
      # setuptools-scm derives the version from the tag, so this is a sanity
      # check that the built artifact agrees with the release tag rather than a
      # guard against a hand-edited version. On workflow_dispatch with no tag
      # (the default branch), the built version is the fallback.
      - name: Verify the tag matches the built version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --no-deps dist/*.whl
          version=$(python -c "import autofish; print(autofish.__version__)")
          if [ -n "$TAG" ]; then
            tag_version="${TAG#autofish-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag '$TAG' != built version $version"
              exit 1
            fi
            echo "tag $TAG matches built version $version"
          else
            echo "no release tag on this event; built version is $version"
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run the test suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dist/"*.whl pytest "jax" "flax" "pisces-lite>=4.1.0" safetensors pandas matplotlib
          python -m pytest autofish/tests -q

  pypi-publish:
    name: Publish to PyPI
    needs: [build, test]
    # Publish only on a published release; workflow_dispatch stops after testing.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arcascope-autofish
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: List distributions
        run: ls -lh dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
